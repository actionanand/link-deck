name: Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [main-android]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  MIN_SDK_VERSION: 24
  TARGET_SDK_VERSION: 36
  RELEASE_BASENAME: link-deck

jobs:
  build:
    if: github.ref == 'refs/heads/main-android' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install locked dependencies
        run: npm ci

      - name: Install Capacitor build tools
        run: npm install --no-save --package-lock=false @capacitor/core@8.4.2 @capacitor/android@8.4.2 @capacitor/cli@8.4.2

      - name: Quality checks
        run: |
          npm run lint
          npm run build -- --configuration=production

      - name: Bump Android build number
        if: github.ref == 'refs/heads/main-android'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/bump-android-version.js
          VERSION_CODE=$(node -p "require('./android-version.json').versionCode")
          git add android-version.json
          git diff --cached --quiet || git commit -m "chore: bump Android versionCode to $VERSION_CODE [skip ci]"
          git pull --rebase --autostash
          git push

      - name: Generate and sync Android project
        run: |
          npx cap add android
          npx cap sync android
          node scripts/patch-android.mjs

      - name: Apply Android version and SDK levels
        working-directory: android/app
        run: |
          VERSION_CODE=$(node -p "require('../../android-version.json').versionCode")
          VERSION_NAME=$(node -p "require('../../android-version.json').versionName")
          sed -i 's/versionCode [0-9]*/versionCode project.hasProperty("versionCode") ? project.versionCode.toInteger() : 1/' build.gradle
          sed -i 's/versionName "[^"]*"/versionName project.hasProperty("versionName") ? project.versionName : "1.0.0"/' build.gradle
          sed -i "s/minSdkVersion = .*/minSdkVersion = $MIN_SDK_VERSION/" ../variables.gradle
          sed -i "s/targetSdkVersion = .*/targetSdkVersion = $TARGET_SDK_VERSION/" ../variables.gradle
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_FILE=${RELEASE_BASENAME}-${VERSION_NAME//./-}" >> "$GITHUB_ENV"

      - name: Generate launcher and Play Store icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          declare -A SIZES=([mipmap-mdpi]=48 [mipmap-hdpi]=72 [mipmap-xhdpi]=96 [mipmap-xxhdpi]=144 [mipmap-xxxhdpi]=192)
          for DIR in "${!SIZES[@]}"; do
            SIZE=${SIZES[$DIR]}
            ICON_SIZE=$((SIZE * 72 / 100))
            mkdir -p "android/app/src/main/res/$DIR"
            convert public/link-deck.png -background none -resize "${ICON_SIZE}x${ICON_SIZE}" -gravity center -extent "${SIZE}x${SIZE}" "android/app/src/main/res/$DIR/ic_launcher.png"
            cp "android/app/src/main/res/$DIR/ic_launcher.png" "android/app/src/main/res/$DIR/ic_launcher_round.png"
            cp "android/app/src/main/res/$DIR/ic_launcher.png" "android/app/src/main/res/$DIR/ic_launcher_foreground.png"
          done
          mkdir -p release
          convert public/link-deck.png -background none -resize 420x420 -gravity center -extent 512x512 release/playstore-icon.png

      - name: Clear previous Android release artifacts
        run: |
          mkdir -p release
          rm -f release/*.apk release/*.aab release/*.apk.idsig release/*-mapping.txt

      - name: Build release APK and AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Preserve R8 deobfuscation mapping
        run: |
          MAPPING_SOURCE="android/app/build/outputs/mapping/release/mapping.txt"
          MAPPING_TARGET="release/${RELEASE_FILE}-mapping.txt"
          test -s "$MAPPING_SOURCE"
          cp "$MAPPING_SOURCE" "$MAPPING_TARGET"
          test -s "$MAPPING_TARGET"
          echo "MAPPING_FILE=$MAPPING_TARGET" >> "$GITHUB_ENV"
          echo "R8 mapping created: $MAPPING_TARGET"

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" ]]; then
            if printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks; then
              echo "available=true" >> "$GITHUB_OUTPUT"
              echo "Release keystore decoded. Signed artifacts will be attempted."
            else
              rm -f android/app/release-keystore.jks
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "KEYSTORE_BASE64 could not be decoded. Unsigned artifacts will be published."
            fi
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are incomplete. Unsigned artifacts will be published."
          fi

      - name: Detect keystore type
        id: keystore_type
        if: steps.keystore.outputs.available == 'true'
        continue-on-error: true
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          KS_TYPE=$(keytool -list -keystore android/app/release-keystore.jks -storepass:env KEYSTORE_PASSWORD 2>/dev/null | grep -i "Keystore type" | awk '{print $NF}')
          echo "type=$KS_TYPE" >> "$GITHUB_OUTPUT"
          echo "Detected keystore type: $KS_TYPE"

      - name: Sign release APK
        id: sign_apk
        if: steps.keystore.outputs.available == 'true'
        continue-on-error: true
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ steps.keystore_type.outputs.type == 'PKCS12' && secrets.KEYSTORE_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"
          UNSIGNED_APK=$(find android/app/build -name '*-release-unsigned.apk' | head -1)
          OUTPUT_APK="release/${RELEASE_FILE}.apk"
          test -s "$UNSIGNED_APK"
          rm -f "$OUTPUT_APK"
          "$BUILD_TOOLS/zipalign" -v 4 "$UNSIGNED_APK" "$OUTPUT_APK"
          "$BUILD_TOOLS/apksigner" sign --ks android/app/release-keystore.jks --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD "$OUTPUT_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$OUTPUT_APK"
          echo "Signed APK created: $OUTPUT_APK"

      - name: Copy unsigned release APK
        if: steps.keystore.outputs.available != 'true' || steps.sign_apk.outcome == 'failure'
        run: |
          UNSIGNED_APK=$(find android/app/build -name '*-release-unsigned.apk' | head -1)
          OUTPUT_APK="release/${RELEASE_FILE}-unsigned.apk"
          test -s "$UNSIGNED_APK"
          rm -f "release/${RELEASE_FILE}.apk" "$OUTPUT_APK"
          cp "$UNSIGNED_APK" "$OUTPUT_APK"
          echo "Unsigned APK created: $OUTPUT_APK"

      - name: Sign release AAB
        id: sign_aab
        if: steps.keystore.outputs.available == 'true'
        continue-on-error: true
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ steps.keystore_type.outputs.type == 'PKCS12' && secrets.KEYSTORE_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          UNSIGNED_AAB=$(find android/app/build -name '*-release.aab' | head -1)
          OUTPUT_AAB="release/${RELEASE_FILE}.aab"
          test -s "$UNSIGNED_AAB"
          rm -f "$OUTPUT_AAB"
          STORE_PASS_FILE=$(mktemp)
          KEY_PASS_FILE=$(mktemp)
          trap 'rm -f "$STORE_PASS_FILE" "$KEY_PASS_FILE"' EXIT
          printf '%s' "$KEYSTORE_PASSWORD" > "$STORE_PASS_FILE"
          printf '%s' "$KEY_PASSWORD" > "$KEY_PASS_FILE"
          jarsigner -verbose -keystore android/app/release-keystore.jks -storepass:file "$STORE_PASS_FILE" -keypass:file "$KEY_PASS_FILE" -signedjar "$OUTPUT_AAB" "$UNSIGNED_AAB" "$KEY_ALIAS"
          jarsigner -verify -verbose -certs "$OUTPUT_AAB"
          echo "Signed AAB created: $OUTPUT_AAB"

      - name: Copy unsigned release AAB
        if: steps.keystore.outputs.available != 'true' || steps.sign_aab.outcome == 'failure'
        run: |
          UNSIGNED_AAB=$(find android/app/build -name '*-release.aab' | head -1)
          OUTPUT_AAB="release/${RELEASE_FILE}-unsigned.aab"
          test -s "$UNSIGNED_AAB"
          rm -f "release/${RELEASE_FILE}.aab" "$OUTPUT_AAB"
          cp "$UNSIGNED_AAB" "$OUTPUT_AAB"
          echo "Unsigned AAB created: $OUTPUT_AAB"

      - name: Summarize and verify Android artifacts
        run: |
          echo "## Android artifact summary" >> "$GITHUB_STEP_SUMMARY"
          find release -maxdepth 1 \( -name '*.apk' -o -name '*.aab' -o -name '*-mapping.txt' -o -name 'playstore-icon.png' \) -type f -print -exec ls -lh {} \;
          APK_FILE=$(find release -maxdepth 1 -name '*.apk' -type f | head -1)
          AAB_FILE=$(find release -maxdepth 1 -name '*.aab' -type f | head -1)
          test -s "$APK_FILE"
          test -s "$AAB_FILE"
          test -s "$MAPPING_FILE"
          echo "- APK: \`$APK_FILE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- AAB: \`$AAB_FILE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- R8 mapping: \`$MAPPING_FILE\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$APK_FILE" == *-unsigned.apk ]]; then
            echo "- Signing: unsigned fallback" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Signing: signed and verified" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit generated files on Android branch
        if: github.ref == 'refs/heads/main-android'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add release/
          git diff --cached --quiet || git commit -m "build: update Android release files [skip ci]"
          git push

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: link-deck-android-${{ env.VERSION_NAME }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.apk
            release/*.aab
            release/*-mapping.txt
            release/playstore-icon.png

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/release-keystore.jks
